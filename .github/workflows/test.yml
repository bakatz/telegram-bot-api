name: Test

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.25.x
      id: go

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build
      run: go build -v .

    - name: Test
      run: go test -coverprofile=coverage.out -covermode=atomic -v .

    - name: Upload coverage report
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
